name: OSOJI Local CI
on:
  push:
    branches: [feat/osoji-local-first]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      # The legacy lockfile references a private FIF registry; only CI uses a fresh public-registry resolution.
      - run: rm package-lock.json && npm install --ignore-scripts --no-audit --registry=https://registry.npmjs.org
      - run: npm run build
